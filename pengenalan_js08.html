<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Praktikum JavaScript</h1>

    <!-- Mini Project -->
    <section>
      <h2>8. Form Biodata Mahasiswa</h2>
      <form id="formBiodata">

        <div class="form-group">
          <label for="nama">Nama Lengkap:</label>
          <input type="text" id="nama" placeholder="Masukkan nama...">
          <span class="error-msg" id="errNama"></span>
        </div>

        <div class="form-group">
          <label for="nim">NIM:</label>
          <input type="text" id="nim" placeholder="Masukkan NIM...">
          <span class="error-msg" id="errNim"></span>
        </div>

        <div class="form-group">
          <label for="prodi">Program Studi:</label>
          <select id="prodi">
            <option value="">-- Pilih Program Studi --</option>
            <option value="Informatika">Informatika</option>
            <option value="Sistem Informasi">Sistem Informasi</option>
            <option value="Teknik Komputer">Teknik Komputer</option>
          </select>
          <span class="error-msg" id="errProdi"></span>
        </div>

        <div class="form-group">
          <label>Jenis Kelamin:</label>
          <div class="radio-group" id="genderContainer">
            <label><input type="radio" name="gender" value="Laki-laki"> Laki-laki</label>
            <label><input type="radio" name="gender" value="Perempuan"> Perempuan</label>
          </div>
          <span class="error-msg" id="errGender"></span>
        </div>

        <button type="submit">Simpan</button>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
