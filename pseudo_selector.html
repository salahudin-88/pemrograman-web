<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan CSS Pseudo-Classes &amp; Pseudo-Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
            color: #333333;
        }
        .box {
            border: 1px solid #cccccc;
            background-color: #ffffff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
        }
        
        /* Tombol dengan efek :hover */
        .btn {
            background-color: #a5bbca;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #295989; /* Berubah warna saat kursor di atasnya */
        }

        /* Input dengan efek :focus */
        .input-field {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .input-field:focus {
            border-color: #27ae60; /* Border berubah hijau saat diklik/aktif */
            background-color: #e8f8f5;
        }
        /* Memilih elemen anak pertama */
        .daftar-item li:first-child {
            font-weight: bold;
            color: #e74c3c;
        }

        /* Memilih elemen anak terakhir */
        .daftar-item li:last-child {
            font-style: italic;
            color: #8e44ad;
        }

        /* Memilih elemen anak genap (even) */
        .tabel-data tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>Pseudo-Class :hover &amp; :focus</h3>
        <button class="btn">Arahkan Kursor Ke Sini (:hover)</button>
        <br><br>
        <input type="text" class="input-field" placeholder="Klik di sini (:focus)...">
    </div>
     <div class="box">
        <h3>:first-child, :last-child, &amp; :nth-child(n)</h3>
        <ul class="daftar-item">
            <li>Item Pertama (:first-child - Merah Tebal)</li>
            <li>Item Kedua</li>
            <li>Item Ketiga</li>
            <li>Item Terakhir (:last-child - Ungu Miring)</li>
        </ul>

        <table border="1" cellpadding="8" class="tabel-data" style="border-collapse: collapse; width: 100%;">
            <tr><th>No</th><th>Nama</th></tr>
            <tr><td>1</td><td>Budi (:nth-child(even) - Abu-abu)</td></tr>
            <tr><td>2</td><td>Siti</td></tr>
            <tr><td>3</td><td>Andi (:nth-child(even) - Abu-abu)</td></tr>
        </table>
    </div>

</body>
</html>
